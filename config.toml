# The URL the site will be built for
base_url = "https://stopthrowingrocks.net"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

ignored_content = [
  "*.zola-ignore.md",
  "*.draft.md",
  "**/README.md",
  "**/node_modules/**",
  # starbattle-v2 is a Vite app: publish only its built `build/` output, not the
  # sources, tooling, or the dev-server entry (which would clobber index.html).
  "**/starbattle-v2/index.html",
  "**/starbattle-v2/*.json",
  "**/starbattle-v2/*.ts",
  "**/starbattle-v2/src/**",
  "**/starbattle-v2/scripts/**",
  "**/starbattle-v2/ref/**",
  "**/starbattle-v2/public/**",
  "**/starbattle-v2/dist/**"
]

[markdown]

[extra]
# Put all your custom variables here
