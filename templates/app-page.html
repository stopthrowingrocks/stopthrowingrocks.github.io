{# Full-bleed page for self-contained apps: no section/container chrome and no
   site stylesheet, so the app owns the whole viewport and its own CSS. #}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.extra.tab_title is defined %}{{ page.extra.tab_title }}{% else %}{{ page.title }}{% endif %}</title>
</head>

<body>
  {{ page.content | safe }}
</body>

</html>
